#==============================================#
# Corpse Spawn by RedSMURF: Configuration file #
#==============================================#

# To add a new corpse, follow the example below
# [Corpse Name]
# CORPSE_MODEL                  = Path of corpse's model
# CORPSE_TEAM                   = 0 - Disabled      1 - Terrorist Only,  2 - CT Only,       3 - Both Teams
# CORPSE_FLAGS                  = a - Solid         b - Anim             c - Poison         d - Weapon
# CORPSE_SPAWN_CHANCE           = Corpse's respawn probability (0.0 = never, 1.0 = always)
# CORPSE_RADIUS                 = Poison damage radius (Default = 200)
# CORPSE_SPEED                  = Speed factor (1.0 = base speed, 0.0 = immobilized)
# CORPSE_GRAVITY                = Speed factor (1.0 = base gravity, 0.0 = floating)
# CORPSE_POISON_DAMAGE_MIN      = Min poison damage per tick
# CORPSE_POISON_DAMAGE_MAX      = Max poison damage per tick
# CORPSE_POISON_DURATION_MIN    = Min seconds of poison
# CORPSE_POISON_DURATION_MAX    = Max seconds of poison
# CORPSE_WEAPON_LIST            = Weapon priority list (e.g. 16 17 29)

# To make an corpse available in the menu, you must defined at least it's name like this [Alien]
# corpse model and sound cannot be changed dynamically during gameplay

[Main Settings]
SETTING_DEFAULT_MODEL       = models/CorpseSpawn/alien.mdl

SETTING_CORPSE_LOAD         = 1       # Whether to load saved corpses data of the current map
SETTING_CORPSE_NOCLIP       = 1       # Whether to grant a temporarily noclip for players placing corpses
SETTING_CORPSE_SOLID        = 1       # Whether spawned corpses have solid collisions
SETTING_CORPSE_ANIM         = 1       # Whether spawned corpses play animations
SETTING_CORPSE_ACTION       = 1       # Whether spawned corpses can be placed
SETTING_CORPSE_EFFECT       = 1       # Whether spawned corpses apply damage effects
SETTING_OFFSET_BASE         = 120.0   # Default forward offset when previewing corpse placement
SETTING_OFFSET_MIN          = 65.0    # Minimum offset from the player to the corpse
SETTING_OFFSET_MAX          = 900.0   # Maximum offset from the player to the corpse
SETTING_OFFSET_STEP         = 10.0    # Step size when scrolling to move corpse forward/backward
SETTING_OFFSET_FREQ         = 0.1     # Scroll responsivness for placement offset (lower = faster)
SETTING_EFFECT_FREQ         = 1.0     # Poison damage refresh rate (min = 0.1)
SETTING_GHOST_FREQ          = 0.1     # Refresh rate of the ghost model (min = 0.1)
SETTING_GHOST_ALPHA         = 120     # Transparency level of the ghost preview model (0 - 255)

SETTING_SOUND_MENU_NAV      = buttons/blip1.wav
SETTING_SOUND_MENU_REMOVE   = buttons/button10.wav

SETTING_COLOR_ACTIVE        = 0 255 0
SETTING_COLOR_INACTIVE      = 255 0 0

